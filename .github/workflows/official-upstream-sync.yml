name: Official upstream sync review

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: CyoriaSMP-Team/Folia-Ports/.github/workflows/upstream-sync.yml@main
    with:
      upstream_repo: espidev/ProtectionStones
      upstream_branch: master
      target_branch: folia/1.21.11
      java_version: '21'
      build_system: maven
      build_command: mvn -B package --file pom.xml
